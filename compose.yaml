services:
  api:
    build: .
    ports: ["127.0.0.1:18091:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 2
      start_period: 2s
  inventory:
    build: .
    environment:
      ROLE: inventory
